server.port=8080

# Conexion a PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/tfg_concurrencia
spring.datasource.username=tfg_user
spring.datasource.password=tfg_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion del Pool de Conexiones (Hikari)
# Es vital para el experimento que el pool sea lo suficientemente grande
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000

# Desactivar logs innecesarios para no afectar la latencia
logging.level.root=WARN
logging.level.com.tfg=INFO